# Repo PÚBLICO: los logs solo muestran conteos (sin nombres, ids ni textos).
# MODO REAL (aprobado por el dueño 17-nov-2026): envía el gracias post-venta y responde
# preguntas comunes con plantillas.json. Sin correos: el aviso queda en el estado cifrado.
name: kpp-vigia
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
    inputs:
      refresh:
        description: "Forzar renovación del token (prueba)"
        type: boolean
        default: false
      dry_run:
        description: "Correr en modo prueba (no envía nada)"
        type: boolean
        default: false
      solo:
        description: "Solo una parte (pedidos = refrescar datos de pedidos, sin gracias ni preguntas)"
        type: choice
        options: [todo, pedidos]
        default: todo
concurrency: {group: kpp-vigia, cancel-in-progress: false}   # nunca dos corridas a la vez (token rotatorio)
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GIST_ID: ${{ secrets.GIST_ID }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      ML_ALERT_FILE: /tmp/kpp_alerta.txt
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests cryptography
      - name: Bajar estado cifrado
        run: python deploy/sync_gist.py pull
      - name: Revisar ventas y preguntas
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_LIVE: ${{ github.event.inputs.dry_run == 'true' && '0' || '1' }}
        run: python ml_bot.py ${{ github.event.inputs.dry_run != 'true' && '--live' || '' }} ${{ github.event.inputs.refresh == 'true' && '--refresh' || '' }} ${{ github.event.inputs.solo == 'pedidos' && '--solo pedidos' || '' }}
      - name: Subir estado cifrado (siempre, guarda el refresh token nuevo)
        if: always()
        run: python deploy/sync_gist.py push
      - name: Aviso para el bot (sin datos personales)
        if: always()
        run: |
          f="$ML_ALERT_FILE"
          [ -s "$f" ] || { echo "sin alertas"; exit 0; }
          a=$(cat "$f")
          case "$a" in
            *gracias_fallido*) echo "::error::Un gracias no se pudo verificar en el chat: revisar estado (gist)"; exit 1;;
            *gracias_pendiente*) echo "::warning::Hay ventas sin gracias visible para el bot (estado cifrado): $a";;
            *) echo "::warning::Hay preguntas para el bot: $a";;
          esac
